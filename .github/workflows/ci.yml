name: Python CI
on:
    push:
         branches:
                  - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
       - name: Checkout Repository
         uses: actions/checkout@v4 #Downloads your GitHub repository

       - name: Set up Python
         uses: actions/setup-python@v5
         with:
          python-version: "3.14"

       - name: Install dependencies
         run: pip install -r requirements.txt

       - name: Build Docker image
         run: docker build -t pak-news-summarizer .